
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ComputerCare</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

    <a class="back-link" href="index.html">← Back to Client Website</a>

    <main class="login-card">
        <div class="login-icon">🔐</div>
        <h1>Administrator Login</h1>
        <p>Sign in to manage computer appointments.</p>

        <form id="adminLoginForm">
            <label for="username">Username</label>
            <input id="username" type="text"
                   placeholder="Enter admin username" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Enter admin password" required>

            <button class="admin-btn" type="button">Login</button>
            <p class="login-message" role="status">HTML/CSS-only demo. Login authentication is not enabled.</p>
        </form>

    </main>

</body>
</html>
